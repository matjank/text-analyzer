# Gemini API klíč - nastav přes proměnnou prostředí GEMINI_API_KEY
# NIKDY nedávej skutečný klíč přímo sem!
gemini.api.key=${GEMINI_API_KEY:your-api-key-here}

# Server
server.port=8080

# Logging - zobrazí detailní chyby při volání Gemini
logging.level.com.example.analyzer=DEBUG
logging.level.org.springframework.web.reactive=DEBUG

# Zobrazí plnou stack trace v konzoli
server.error.include-message=always
server.error.include-stacktrace=never
